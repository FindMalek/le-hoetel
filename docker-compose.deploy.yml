# Staging and production on Dokploy (compose service, build from git). One copy per environment, own postgres and volume.
# Dokploy attaches the domains to api, web, dashboard and docs. Env comes from the compose Environment tab, see .github/scripts/dokploy-bootstrap.mjs.
x-env: &env
  DEPLOY_ENV: ${DEPLOY_ENV:?}
  API_PUBLIC_URL: ${API_PUBLIC_URL:?}
  WEB_URL: ${WEB_URL:?}
  DASHBOARD_URL: ${DASHBOARD_URL:?}
  DOCS_URL: ${DOCS_URL:?}
  DATABASE_URL: postgres://${POSTGRES_USER:-ritorno}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-ritorno}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SEED: ${SEED:-none}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_REPO: ${GITHUB_REPO:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
  MESSAGING_LIVE: ${MESSAGING_LIVE:-false}
  ALLOW_PREVIEW_ORIGINS: ${ALLOW_PREVIEW_ORIGINS:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PREFIX: ${S3_PREFIX:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  EMAIL_FROM: ${EMAIL_FROM:-Ritorno <onboarding@resend.dev>}
  KAPSO_API_KEY: ${KAPSO_API_KEY:-}
  KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
  WHATSAPP_NOTIFY_TO: ${WHATSAPP_NOTIFY_TO:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  AI_MODEL: ${AI_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
  OPENOBSERVE_URL: ${OPENOBSERVE_URL:-}
  OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-}
  OPENOBSERVE_USER: ${OPENOBSERVE_USER:-}
  OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-}

# Inlined into client code by `next build`, so web and dashboard get them as build args and as runtime env.
x-next-public: &next-public
  NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
  NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}

x-next-env: &next-env
  <<: *next-public
  API_URL: http://api:3001
  API_PUBLIC_URL: ${API_PUBLIC_URL:?}
  WEB_URL: ${WEB_URL:?}
  DASHBOARD_URL: ${DASHBOARD_URL:?}
  DOCS_URL: ${DOCS_URL:?}
  LOG_LEVEL: ${LOG_LEVEL:-}
  WHATSAPP_CONTACT_NUMBER: ${WHATSAPP_CONTACT_NUMBER:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritorno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-ritorno}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
      args:
        GIT_SHA: ${GIT_SHA:-}
    environment:
      <<: *env
      JOBS_WORKER: "false"
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
      args:
        GIT_SHA: ${GIT_SHA:-}
    environment:
      <<: *env
    # The api runs the migrations on start, the worker waits for them.
    depends_on:
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        <<: *next-public
    environment:
      <<: *next-env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        <<: *next-public
    environment:
      <<: *next-env
    expose:
      - "3002"
    depends_on:
      api:
        condition: service_healthy

  docs:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL:?}
      WEB_URL: ${WEB_URL:?}
      DASHBOARD_URL: ${DASHBOARD_URL:?}
      DOCS_URL: ${DOCS_URL:?}
    expose:
      - "3003"

volumes:
  pg:
