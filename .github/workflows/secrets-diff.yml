name: secrets-diff

# Lists the keys of .env.example that Infisical lacks, per environment (names only).
# The compare job lists, per stack, the keys whose Infisical value differs from the live Dokploy env (names only).
# INFISICAL_URL falls back to the tailnet host so this runs before deploys read Infisical.
# Needs repo variables INFISICAL_URL and INFISICAL_PROJECT_ID and secrets INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    name: infisical keys
    runs-on: ubuntu-latest
    env:
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: join the tailnet (Infisical is tailnet only)
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - run: node .github/scripts/secrets-diff.mjs
        env:
          INFISICAL_URL: ${{ vars.INFISICAL_URL || 'https://secrets.findmalek.engineer' }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  compare:
    name: dokploy vs infisical
    runs-on: ubuntu-latest
    env:
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: join the tailnet (Infisical is tailnet only)
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - run: node .github/scripts/secrets-compare.mjs
        env:
          INFISICAL_URL: ${{ vars.INFISICAL_URL || 'https://secrets.findmalek.engineer' }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_STAGING_COMPOSE_ID: ${{ vars.DOKPLOY_STAGING_COMPOSE_ID }}
          DOKPLOY_PRODUCTION_COMPOSE_ID: ${{ vars.DOKPLOY_PRODUCTION_COMPOSE_ID }}
