name: secrets-diff

# Lists the keys of .env.example that Infisical lacks, per environment (names only).
# Needs repo variables INFISICAL_URL and INFISICAL_PROJECT_ID and secrets INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    name: infisical keys
    runs-on: ubuntu-latest
    env:
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: join the tailnet (Infisical is tailnet only)
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - run: node .github/scripts/secrets-diff.mjs
        env:
          INFISICAL_URL: ${{ vars.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
