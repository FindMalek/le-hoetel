name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://le-hoetel:le-hoetel@localhost:5432/le-hoetel
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: le-hoetel
          POSTGRES_PASSWORD: le-hoetel
          POSTGRES_DB: le-hoetel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U le-hoetel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Turbo cache fallback (no remote cache)
        if: env.TURBO_TOKEN == ''
        uses: actions/cache@v6
        with:
          path: |
            .turbo/cache
            apps/*/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm i18n:check
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db)" ]; then
            git status --short packages/db
            echo "::error::schema and migrations disagree, run pnpm db:generate and commit the result"
            exit 1
          fi
      - run: pnpm check-types ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - run: pnpm test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Build
        run: |
          cp .env.example .env
          printf 'BETTER_AUTH_SECRET=%s\nADMIN_PASSWORD=%s\n' ci-build-only-secret-not-used-at-runtime-0123456789 ci-build-only >> .env
          pnpm build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
