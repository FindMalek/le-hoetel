name: staging

# Deploys main to the staging compose service on Dokploy once ci is green on main.
# Needs repo variables DOKPLOY_URL and DOKPLOY_STAGING_COMPOSE_ID and secret DOKPLOY_TOKEN.
# Optional: variable STAGING_API_URL (public api url, checked at /health after the deploy).
# Without them the job exits green with a note in the summary.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: dokploy staging
    runs-on: ubuntu-latest
    env:
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      healthy-sha: ${{ steps.deploy.outputs.healthy-sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: join the tailnet (Infisical is tailnet only)
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - id: deploy
        run: node .github/scripts/deploy.mjs
        env:
          TARGET: staging
          REF: main
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_STAGING_COMPOSE_ID: ${{ vars.DOKPLOY_STAGING_COMPOSE_ID }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          INFISICAL_URL: ${{ vars.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  # Keeps the release PR up to date and releases it once merged, only after an automatic (ci triggered) healthy deploy.
  release:
    needs: deploy
    if: github.event_name == 'workflow_run' && needs.deploy.outputs.healthy-sha != ''
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.deploy.outputs.healthy-sha }}
    secrets: inherit
