name: release

# staging.yml calls this after every healthy staging deploy of main. release-please keeps one release PR open (version
# and CHANGELOG from the conventional commits on main). Once that PR is merged, the next call tags vX.Y.Z on its merge
# commit and production deploys that tag. Nothing else reaches production, except a manual run with `tag`: rollback to
# an older tag or redeploy of the current one.
# Needs the same Dokploy variables as staging plus DOKPLOY_PRODUCTION_COMPOSE_ID and PRODUCTION_API_URL.
# Optional secret RELEASE_PLEASE_TOKEN (contents, pull requests and issues write): without it the release PR is opened
# with the workflow token, which starts no checks, so close and reopen it before merging.

on:
  workflow_call:
    inputs:
      sha:
        description: the commit staging proved healthy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: existing vX.Y.Z tag to deploy to production (rollback or redeploy)
        required: true

permissions:
  contents: read

jobs:
  release-please:
    name: release please
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.release_created == 'true' && steps.tag.outputs.tag_name || '' }}
    steps:
      # release-please tags a merged release PR wherever main is now, which can be ahead of what this run proved.
      - name: merged release commit passed ci and staging
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          pending=$(gh pr list -R "$GITHUB_REPOSITORY" --state merged --base main --label "autorelease: pending" \
            --json mergeCommit --jq '.[0].mergeCommit.oid // empty')
          [ -n "$pending" ] || exit 0
          position=$(gh api "repos/$GITHUB_REPOSITORY/compare/$pending...$SHA" --jq .status)
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$pending/check-runs?check_name=ci" \
            --jq '[.check_runs[].conclusion] | if length == 0 then "none" elif all(. == "success") then "success" else "failed" end')
          if [[ "$position" =~ ^(ahead|identical)$ ]] && [ "$ci" = success ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=release waits::release commit $pending: ci $ci, staging $SHA is $position of it"
          fi
      # Tagged with the workflow token on purpose: it fires no `release` event, production deploys once, from here.
      - id: tag
        if: steps.gate.outputs.ready == 'true'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - id: pr
        # never holds up the production deploy of a tag made above
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - if: steps.pr.outcome == 'failure'
        run: echo "::warning title=release pr::could not open or update the release PR, see the step above"

  deploy-production:
    needs: release-please
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.tag != '') }}
    runs-on: ubuntu-latest
    env:
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
      REF: ${{ inputs.tag || needs.release-please.outputs.tag }}
    timeout-minutes: 30
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: tag only
        run: '[[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "production deploys a vX.Y.Z tag, got $REF"; exit 1; }'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: join the tailnet (Infisical is tailnet only)
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - run: node .github/scripts/deploy.mjs
        env:
          TARGET: production
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_PRODUCTION_COMPOSE_ID: ${{ vars.DOKPLOY_PRODUCTION_COMPOSE_ID }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          INFISICAL_URL: ${{ vars.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  # A release made with the workflow token fires no `release` event, so translations are called from here.
  translate:
    needs: release-please
    if: needs.release-please.outputs.tag != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/languine.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
