name: release

# Automatic: when the staging deploy of a main commit succeeds, the next version is tagged on that exact commit (minor
# when a type:feature PR was merged since the last tag, patch otherwise, nothing when no PR was merged), notes come
# from the merged PR titles grouped by type:* label, the GitHub release is created and production deploys from the tag.
# Manual run from the Actions tab: choose the bump (major only this way); dry_run (default) only prints the version and
# the notes. A release published by hand also deploys.
# Rollback: set `tag` to an older tag, nothing is released and that tag is redeployed.
# Needs the same Dokploy variables as staging plus DOKPLOY_PRODUCTION_COMPOSE_ID and PRODUCTION_API_URL.

on:
  workflow_call:
    inputs:
      sha:
        description: the commit staging proved healthy
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: version part to bump
        type: choice
        options: [auto, minor, patch, major]
        default: auto
      dry_run:
        description: only print the version and notes
        type: boolean
        default: true
      tag:
        description: "rollback: deploy this existing tag instead of releasing"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    if: inputs.sha != '' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      checks: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: main only
        if: github.ref != 'refs/heads/main'
        run: echo "run the release from main" && exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # the commit staging just deployed, not whatever main points to now
          ref: ${{ inputs.sha || github.sha }}
      - name: ci passed on this commit
        if: inputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci" --jq '[.check_runs[].conclusion] | if length == 0 then "none" elif all(. == "success") then "success" else "failed" end')
          [ "$state" = success ] || { echo "ci is $state on $SHA, no release"; exit 1; }
      - id: notes
        run: node .github/scripts/release-notes.mjs
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          GH_TOKEN: ${{ github.token }}
      - run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - id: publish
        if: ${{ steps.notes.outputs.skip != 'true' && (inputs.sha != '' || !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TARGET: ${{ inputs.sha || github.sha }}
        run: |
          gh release create "$TAG" --target "$TARGET" --title "$TAG" --notes-file release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: release
    # A release made with the workflow token does not fire `release: published`, so it deploys from here once.
    if: always() && (github.event_name == 'release' || inputs.tag != '' || needs.release.outputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: tag only
        env:
          REF: ${{ inputs.tag || needs.release.outputs.tag || github.event.release.tag_name }}
        run: '[[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "production deploys a vX.Y.Z tag, got $REF"; exit 1; }'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/deploy.mjs
        env:
          TARGET: production
          REF: ${{ inputs.tag || needs.release.outputs.tag || github.event.release.tag_name }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_PRODUCTION_COMPOSE_ID: ${{ vars.DOKPLOY_PRODUCTION_COMPOSE_ID }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          INFISICAL_URL: ${{ vars.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
