# Local development database: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritorno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritorno}
      POSTGRES_DB: ${POSTGRES_DB:-ritorno}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ritorno-pg:/var/lib/postgresql/data

volumes:
  ritorno-pg:
